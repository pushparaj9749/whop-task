name: Clip Pipeline

on:
  push:
    branches:
      - arena/4b08500f-whop-task

jobs:
  clip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install gdown faster-whisper pillow 'av==15.1.0'

      - name: Download Episode 1 from Google Drive
        run: |
          python -c "import gdown; gdown.download(id='1_BAuSAmX1qYwz9hLSiIyON0lzi7KTLUx', output='episode.mp4', quiet=False)"
